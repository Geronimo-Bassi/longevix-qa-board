  // Apply the saved theme before the first paint (no flash). No saved value = follow the system.

<style>
  :root {

      --rep: #94a3b8; --tint: 22%; --ink: #fff; --ink-mix: 45%; --shadow: none;

  .filters select.on, .filters input[type=search].on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .filters input[type=search] { min-width: 220px; }

    background: color-mix(in srgb, var(--c) var(--tint), transparent); color: color-mix(in srgb, var(--c), var(--ink) var(--ink-mix)); }

  /* priorities: solid traffic-light colors, so P1 / P2 / P3 read at a glance */
  .p-P1 { background: var(--p1); color: #fff; }

  .s-Sin { background: none; color: var(--muted); font-weight: 500; } .s-Sin::before { background: none !important; box-shadow: inset 0 0 0 1px var(--muted); }

  .tlist.kc { border-top: 3px solid var(--c); }

  .tcard .c { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .tcard .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 5px; }
  .tcard .foot span { display: inline-flex; align-items: center; gap: 3px; }

  .tlist h3 .status { font-weight: 400; }
  .tcards { overflow-y: auto; flex: 1; padding: 0 2px; }
  .tag.archtag { --c: var(--indice); font-weight: 600; }
  .tcard.isarch, tr.isarch td { opacity: .62; }

  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
  .tcard:hover { border-color: var(--accent); }

  .tcard .lbl { height: 8px; min-width: 40px; border-radius: 4px; }
  .tcard .n { font-size: 13.5px; word-wrap: break-word; }
  .tcard .badges { display: flex; gap: 10px; color: var(--muted); font-size: 12px; margin-top: 5px; align-items: center; }
  .tcard .badges span { display: inline-flex; align-items: center; gap: 3px; }
  .tadd { text-align: left; border: none; background: transparent; color: var(--muted); padding: 6px; width: 100%; }
  .tadd:hover { background: var(--line); color: var(--text); }
  .tcover { display: block; width: 100%; max-height: 170px; min-height: 50px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; background: var(--line); }
  .imgfail { display: inline-block; font-size: 12px; color: var(--accent); margin-bottom: 4px; }
  .atts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .att { border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: 12px; color: var(--muted); text-decoration: none; word-break: break-all; background: var(--bg); cursor: pointer; }
  .att img { display: block; width: 100%; height: 90px; object-fit: cover; border-radius: 5px; background: var(--line); margin-bottom: 3px; }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { --c: var(--indice); background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 10px; min-height: 120px; box-shadow: var(--shadow); }

  .k-rech { --c: var(--rech); } .k-fixed { --c: var(--fixed); } .k-rep { --c: var(--rep); } .k-bug { --c: var(--bug); }

  .card .foot span { display: inline-flex; align-items: center; gap: 3px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 16px 0 24px; }
  .kpi { --c: var(--text); text-align: left; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }

  .drawer { position: fixed; inset: 0 0 0 auto; width: min(640px, 100%); background: var(--panel); border-left: 1px solid var(--line); padding: 18px 20px; overflow-y: auto; transform: translateX(100%); visibility: hidden; transition: transform .18s ease, visibility 0s .18s; z-index: 10; }

<script>
(() => {
  // Trello API key of the "Longevix QA Board" Power-Up (public by design; NEVER put the Secret here).
  const TRELLO_KEY = "bfc6ac31677dcc088cbed19bf27049c2";
  const BOARD_ID = "6adf5f90f7a0076b34dde3d8"; // Longevix QA CU Scheduling
  const API = "https://api.trello.com/1";
  const TOKEN_KEY = "lgx-trello-token";
  const AUTO_MS = 2 * 60 * 1000;
  const TIPOS = ["BUG", "Mejora", "Duda", "Bloqueado", "Parcial", "Índice", "Otro"];
  const ESTADOS = ["Rechequear", "Reportado", "FIXED", "Sin etiqueta"];
  const PRIOS = ["P1", "P2", "P3", "—"];
  const LABELS = {}; // label name -> id, filled from the board's labels
  const CARD_FIELDS = "name,desc,idList,labels,shortUrl,dateLastActivity,closed,pos,idAttachmentCover";
  const ATT_FIELDS = "id,name,mimeType,url,previews,isUpload,bytes,date";
  const COVER_Q = { attachments: "cover", attachment_fields: ATT_FIELDS };
  const ACT_FILTER = "createCard,copyCard,convertToCardFromCheckItem,commentCard,addLabelToCard";
  const STALE_DAYS = 3; // Rechequear older than this is flagged in Resumen
  const STATE_LABELS = ["FIXED", "Rechequear", "Reportado"];
  const EDIT_LABELS = ["BUG", "MEJORA", "DUDA", "BLOQUEADO", "PARCIAL", "P1", "P2", "P3"];

  let token = null;
  let members = [];
  let openCardId = null;
  let me = null;
  let cards = [];
  let archived = []; // archived cards, loaded only when "Ver archivadas" is on
  let allLists = []; // open + archived lists (names for archived cards)
  let archLoaded = false, lastByCard = null, archBusy = null;
  let lists = [];
  let lastLoaded = null;
  let loading = false;
  let sort = { key: "list", dir: 1 };
  let timer = null;
  const warnings = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Line icon from the sprite at the top of <body>.
  const ic = (name, small) => `<svg class="ic${small ? " sm" : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  // ---------- data helpers ----------
  // REST card -> the shape classify() expects
  function mapCard(c) {
    const l = lists.find((x) => x.id === c.idList) || allLists.find((x) => x.id === c.idList);
    return { id: c.id, name: c.name, desc: c.desc, url: c.shortUrl, closed: c.closed, labels: c.labels || [],
      list: { id: c.idList, name: l ? l.name : "" }, lastActivityAt: c.dateLastActivity, pos: c.pos,
      cover: (c.attachments || []).find((a) => a.id === c.idAttachmentCover && a.isUpload && isImg(a)) || null };
  }
  function setLabels(labs) {
    for (const k in LABELS) delete LABELS[k];
    (labs || []).forEach((l) => { if (!l.name) return; LABELS[l.name] = l.id; if (!LABELS[l.name.toUpperCase()]) LABELS[l.name.toUpperCase()] = l.id; });
  }

  function listShort(name) {
    const m = name.match(/\(([A-Z]+)\)\s*$/) || name.match(/^[\dX]+\.?\s*(?:—\s*)?([A-Z]+)\s*—/) || name.match(/^X\s*—/);
    if (name.includes("(/book)")) {
      const b = name.match(/^([\dX]+)\.?\s*([A-Z]*)/);
      return "/book " + (b && b[2] ? b[2] : "X");
    }
    return m && m[1] ? m[1] : name;
  }

  function classify(c) {
    const labels = (c.labels || []).map((l) => (l.name || "").toUpperCase());
    const has = (n) => labels.includes(n);
    const name = c.name || "";
    let tipo;
    if (/\]\s*(Pendientes|Resumen)/i.test(name) || /^\[[A-Z]+\]\s*(Pendientes|Resumen)/i.test(name)) tipo = "Índice";
    // Type labels win; the title is only a fallback for cards without a type label.
    else if (has("BLOQUEADO")) tipo = "Bloqueado";
    else if (has("BUG")) tipo = "BUG";
    else if (has("MEJORA")) tipo = "Mejora";
    else if (has("DUDA")) tipo = "Duda";
    else if (has("PARCIAL")) tipo = "Parcial";
    else if (/bloqueado/i.test(name)) tipo = "Bloqueado";
    else if (/\bBUG\b/i.test(name)) tipo = "BUG";
    else if (/mej[op]ra/i.test(name)) tipo = "Mejora";
    else if (/duda/i.test(name)) tipo = "Duda";
    else tipo = "Otro";
    const extra = [];
    if (has("DUDA") && tipo !== "Duda") extra.push("Duda");
    if (has("PARCIAL") && tipo !== "Parcial") extra.push("Parcial");
    if (has("BLOQUEADO") && tipo !== "Bloqueado") extra.push("Bloqueado");
    const prio = has("P1") ? "P1" : has("P2") ? "P2" : has("P3") ? "P3" : "—";
    const estado = has("FIXED") ? "FIXED" : has("RECHEQUEAR") ? "Rechequear" : has("REPORTADO") ? "Reportado" : "Sin etiqueta";
    const caseM = name.match(/^\[([^\]]+)\]/);
    const desc = c.desc || "";
    let tester = "—";
    if (/vbianchi|valen bianchi|QAFRONTDESK/i.test(desc)) tester = "Valentina";
    if (/wtoledo/i.test(desc)) tester = "Walter";
    if (/gbassi/i.test(desc) && !/wtoledo/i.test(desc)) tester = "Gero";
    const title = name.replace(/^\[[^\]]+\]\s*/, "");
    return {
      id: c.id, name, title, desc, url: c.url || c.webUrl,
      caseId: caseM ? caseM[1] : "—",
      list: (c.list && c.list.name) || "", listId: (c.list && c.list.id) || "", listShort: listShort((c.list && c.list.name) || ""),
      labelIds: (c.labels || []).map((l) => l.id),
      tipo, extra, prio, estado, tester,
      labels: (c.labels || []).map((l) => l.name),
      last: c.lastActivityAt ? new Date(c.lastActivityAt) : null,
      pos: c.pos || 0,
      cover: c.cover || null,
      labelObjs: (c.labels || []).map((l) => ({ name: l.name, color: l.color })),
    };
  }

  async function pool(items, n, fn) {
    const out = new Array(items.length);
    let i = 0;
    async function worker() { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
    return out;
  }

  // ---------- errors ----------
  function errText(e) {
    const code = e && e.code;
    switch (code) {
      case "unauthorized": return "Trello rechazó el acceso (401). Si tu conexión venció o la revocaste, tocá «Conectar Trello». Si recién te conectaste, revisá que tu usuario sea miembro del tablero.";
      case "not_found": return "Trello no encontró eso (404). Puede que ya no exista o que tu usuario no sea miembro del tablero.";
      case "rate_limited": return "Trello está recibiendo demasiados pedidos. Esperá unos segundos y tocá Actualizar (arriba a la derecha).";
      case "network": return "No se pudo conectar con Trello (sin internet o bloqueado por el navegador).";
      default: return "Trello devolvió un error" + (e && e.status ? " (" + e.status + ")" : "") + ". " + (e && e.message ? e.message : "");
    }
  }
  function showBanner(html, kind) { $("banner").innerHTML = html ? `<div class="banner ${kind || ""}">${html}</div>` : ""; }

  const AUTH_CODES = ["unauthorized"];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // One call to the Trello REST API. Reads retry on throttling or network errors; writes retry only on 429 (rejected, so safe).
  async function api(method, path, params) {
    const url = new URL(API + path);
    url.searchParams.set("key", TRELLO_KEY);
    url.searchParams.set("token", token);
    const opts = { method, cache: "no-store" };
    if (method === "GET") { for (const k in params || {}) url.searchParams.set(k, params[k]); }
    else if (params instanceof FormData) { opts.body = params; }
    else if (params) { opts.body = new URLSearchParams(params); }
    const waits = [2000, 5000, 12000];
    for (let attempt = 0; ; attempt++) {
      let res;
      try { res = await fetch(url, opts); }
      catch (err) {
        if (method !== "GET" || attempt >= waits.length) throw { code: "network", message: String(err && err.message || err) };
        await sleep(waits[attempt]); continue;
      }
      if (res.ok) { const t = await res.text(); try { return t ? JSON.parse(t) : null; } catch (e) { return t; } }
      const msg = (await res.text().catch(() => "")).slice(0, 200);
      const retry = res.status === 429 || (method === "GET" && res.status >= 500);
      if (retry && attempt < waits.length) {
        const w = waits[attempt] + Math.random() * 1000;
        $("status").textContent = `Trello está lento, reintentando en ${Math.round(w / 1000)} s…`;
        await sleep(w); continue;
      }
      const code = res.status === 401 || res.status === 403 ? "unauthorized" : res.status === 404 ? "not_found" : res.status === 429 ? "rate_limited" : "http";
      throw { code, status: res.status, message: msg };
    }
  }

  // ---------- load ----------
  async function load() {
    if (loading || !token) return;
    imgBlocked = false; imgFails = 0; showImgDiag.done = false; // each refresh tries the images again
    loading = true;
    $("refresh").disabled = true;
    $("refresh").classList.add("spin");
    if (!lastLoaded) $("main").innerHTML = skeleton();
    $("status").textContent = "Leyendo Trello…";
    $("bar").style.width = "30%";
    warnings.length = 0;
    try {
      const [ls, labs, cs] = await Promise.all([
        api("GET", `/boards/${BOARD_ID}/lists`, { filter: "open", fields: "name,pos" }),
        api("GET", `/boards/${BOARD_ID}/labels`, { fields: "name,color", limit: 1000 }),
        api("GET", `/boards/${BOARD_ID}/cards`, { filter: "open", fields: CARD_FIELDS, ...COVER_Q })
          .catch((e) => e && e.status === 400 ? api("GET", `/boards/${BOARD_ID}/cards`, { filter: "open", fields: CARD_FIELDS }) : Promise.reject(e)),
      ]);
      lists = ls || [];
      setLabels(labs);
      cards = keepActivity((cs || []).filter((c) => !c.closed).map(mapCard).map(classify));
      const order = new Map(lists.map((l, i) => [l.name, i]));
      cards.forEach((c) => (c.listOrder = order.has(c.list) ? order.get(c.list) : 999));
      lastLoaded = new Date();
      showBanner(warnings.length ? warnings.map(esc).join("<br>") : "", "warn");
      $("newCard").disabled = !lists.length;
      setTimeout(loadAllActivity, 0);
      if (!members.length) loadMembers();
      loadNotifs();
      archLoaded = false;
      if ($("showArch").checked) loadArchived();
      fillFilters();
      render();
      syncCardFromHash();
    } catch (e) {
      showBanner(esc(errText(e)), "err");
      if (e && e.code === "unauthorized") authFailed();
    } finally {
      loading = false;
      $("refresh").disabled = !token;
      $("refresh").classList.remove("spin");
      $("bar").style.width = "0";
      updateStatus();
    }
  }

  function ago(d) {
    const m = Math.floor((Date.now() - d) / 60000);
    if (m < 1) return "recién";
    if (m < 60) return `hace ${m} min`;
    const h = Math.floor(m / 60);
    return h < 24 ? `hace ${h} h` : `hace ${Math.floor(h / 24)} d`;
  }
  let statusBusy = false;
  function updateStatus() {
    $("status").textContent = lastLoaded ? `${cards.length} tarjetas · actualizado ${ago(lastLoaded)}` : "Sin datos todavía";
    $("status").title = lastLoaded ? "Última lectura: " + lastLoaded.toLocaleString("es-AR") : "";
  }
  setInterval(() => { if (!loading && !statusBusy && lastLoaded) updateStatus(); }, 30000);

  function schedule() {
    clearInterval(timer);
    if ($("auto").checked) timer = setInterval(() => { if (!document.hidden) load(true); }, AUTO_MS);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && $("auto").checked && lastLoaded && Date.now() - lastLoaded > AUTO_MS) load(true);
  });

  // ---------- filters (multi-select) ----------
  const FDEF = [["fTipo", "Tipo", "todos"], ["fPrio", "Prioridad", "todas"], ["fEstado", "Estado", "todos"], ["fTester", "Creada por", "todos"], ["fLista", "Lista", "todas"]];
  const FKEYS = FDEF.map((d) => d[0]);
  const fsel = Object.fromEntries(FKEYS.map((k) => [k, new Set()]));
  let fopts = {};
  function fillFilters() {
    fopts = { fTipo: TIPOS.filter((t) => cards.some((c) => c.tipo === t)), fPrio: PRIOS, fEstado: ESTADOS,
      fTester: [...new Set(cards.map(who))].sort(), fLista: lists.map((l) => l.name) };
    if (!fillFilters.restored) {
      fillFilters.restored = true;
      try {
        const saved = JSON.parse(localStorage.getItem("lgx-filters") || "{}");
        if (typeof saved.q === "string") $("q").value = saved.q;
        FKEYS.forEach((k) => { const v = saved[k]; fsel[k] = new Set((Array.isArray(v) ? v : v ? [v] : []).filter((x) => typeof x === "string")); });
      } catch (e) {}
    }
    renderFdds();
  }
  const fSummary = (k) => {
    const [, label, all] = FDEF.find((d) => d[0] === k), sel = [...fsel[k]];
    return `${label}: ${sel.length ? esc(sel[0]) + (sel.length > 1 ? ` +${sel.length - 1}` : "") : all}`;
  };
  function renderFdds() {
    $("fdds").innerHTML = FDEF.map(([k]) => {
      const vals = [...new Set([...(fopts[k] || []), ...fsel[k]])];
      const dot = ["fTipo", "fPrio", "fEstado"].includes(k);
      return `<details class="fdd${fsel[k].size ? " on" : ""}" data-k="${k}"><summary><span class="fs">${fSummary(k)}</span>${ic("chevron", 1)}</summary><div class="ddm">` +
        vals.map((v) => `<label><input type="checkbox" value="${esc(v)}" ${fsel[k].has(v) ? "checked" : ""}>${dot ? `<span class="dot" ${chipStyle(v)}></span>` : ""}${esc(v)}</label>`).join("") +
        `<button class="fclr" data-k="${k}" ${fsel[k].size ? "" : "hidden"}>Quitar este filtro</button></div></details>`;
    }).join("");
  }
  function saveFilters() {
    try {
      const o = { q: $("q").value };
      FKEYS.forEach((k) => (o[k] = [...fsel[k]]));
      localStorage.setItem("lgx-filters", JSON.stringify(o));
    } catch (e) {}
  }
  function filtered() {
    const q = $("q").value.trim().toLowerCase();
    // "Pendientes / Resumen" index cards stay out of the views unless Tipo = Índice is picked.
    const S = fsel, hide = hideIdx();
    return ($("showArch").checked ? cards.concat(archived) : cards).filter((c) =>
      (!hide || c.tipo !== "Índice") &&
      (!S.fTipo.size || S.fTipo.has(c.tipo) || c.extra.some((x) => S.fTipo.has(x))) &&
      (!S.fPrio.size || S.fPrio.has(c.prio)) &&
      (!S.fEstado.size || S.fEstado.has(c.estado)) &&
      (!S.fTester.size || S.fTester.has(who(c))) &&
      (!S.fLista.size || S.fLista.has(c.list)) &&
      (!q || (c.name + " " + c.desc).toLowerCase().includes(q)));
  }
  const activeFilters = () => FKEYS.filter((k) => fsel[k].size).length + ($("q").value.trim() ? 1 : 0);
  // Reset every filter and apply the given ones ({ fTipo: "BUG" } or arrays). Goes to the table unless stay is set.
  function applyFilters(f, stay) {
    $("q").value = "";
    FKEYS.forEach((k) => fsel[k].clear());
    for (const k in f) {
      if (k === "q") $("q").value = f[k];
      else if (fsel[k]) fsel[k] = new Set([].concat(f[k]));
    }
    renderFdds();
    saveFilters();
    if (stay || route().view === "tabla") render(); else location.hash = "tabla";
  }
  function updateFilterUi() {
    const n = activeFilters();
    $("q").classList.toggle("on", !!$("q").value.trim());
    $("clearF").hidden = !n;
    $("clearF").innerHTML = `${ic("x", 1)} Limpiar filtros (${n})`;
  }
  const emptyState = (txt) => `<div class="empty">${txt || "Ninguna tarjeta con estos filtros."}${activeFilters() ? `<div class="emptyAct"><button data-clear="1">${ic("x", 1)} Limpiar filtros</button></div>` : ""}</div>`;
  function skeleton() {
    const w = [[8, 46, 9, 5, 11, 12], [8, 38, 7, 5, 9, 14], [8, 52, 9, 5, 11, 10], [8, 33, 10, 5, 0, 13], [8, 44, 7, 5, 11, 12], [8, 40, 9, 5, 9, 11], [8, 49, 8, 5, 0, 14]];
    return `<div class="count">&nbsp;</div><div class="skel" aria-label="Cargando tarjetas">` +
      w.map((r) => `<div class="sr">${r.map((x) => `<span class="b" style="width:${x || 0}%"></span>`).join("")}</div>`).join("") + `</div>`;
  }
  const initials = (name) => String(name || "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("") || "·";

  // ---------- render ----------
  function who(c) { return c.creator ? c.creator : c.tester !== "—" ? c.tester + " (est.)" : "—"; }
  const tagTipo = (c) => `<span class="tag t-${esc(c.tipo)}">${esc(c.tipo)}</span>` + c.extra.map((x) => `<span class="tag t-${esc(x)}">${esc(x)}</span>`).join("");
  const CHIP_VAR = { BUG: "--bug", MEJORA: "--mejora", Mejora: "--mejora", DUDA: "--duda", Duda: "--duda", BLOQUEADO: "--bloq", Bloqueado: "--bloq", PARCIAL: "--parcial",
    P1: "--p1", P2: "--p2", P3: "--p3", FIXED: "--fixed", Rechequear: "--rech", Reportado: "--rep", Parcial: "--parcial", "Índice": "--indice" };
  const chipStyle = (k) => `style="--c: var(${CHIP_VAR[k] || "--indice"})"`;
  const tagPrio = (c) => c.prio === "—" ? "" : `<span class="tag p-${c.prio}">${c.prio}</span>`;
  const tagEstado = (c) => `<span class="tag s s-${c.estado === "Sin etiqueta" ? "Sin" : c.estado}">${esc(c.estado)}</span>`;
  const fmtDate = (d) => d ? d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" }) : "";

  // ---------- routing: #view or #view/<cardShortLink> ----------
  const VIEWS = ["tablero", "estado", "tabla", "listas", "resumen"];
  function route() {
    const [v, card] = location.hash.replace(/^#/, "").split("/");
    return { view: VIEWS.includes(v) ? v : "tabla", card: card && /^[\w-]+$/.test(card) ? card : "" };
  }
  const currentView = () => route().view;
  const cardKey = (c) => ((c.url || "").match(/\/c\/([\w-]+)/) || [])[1] || c.id;
  const findCard = (k) => cards.find((c) => cardKey(c) === k || c.id === k) || archived.find((c) => cardKey(c) === k || c.id === k);

  // Re-rendering replaces the view's HTML: keep the scroll of the board, its lists and the page.
  function saveScroll() {
    const b = document.querySelector(".tboard");
    return { view: render.lastView, y: window.scrollY, x: b ? b.scrollLeft : 0,
      lists: b ? [...b.querySelectorAll(".tcards")].map((e) => [e.dataset.k, e.scrollTop]) : [] };
  }
  function restoreScroll(st, view) {
    if (st.view !== view) return;
    const b = document.querySelector(".tboard");
    if (b) {
      b.scrollLeft = st.x;
      st.lists.forEach(([k, top]) => { const e = b.querySelector(`.tcards[data-k="${CSS.escape(k || "")}"]`); if (e) e.scrollTop = top; });
    }
    window.scrollTo(window.scrollX, st.y);
  }
  // The board takes exactly the height left in the window, so only its lists scroll (no second page scrollbar).
  function fitBoard() {
    const b = document.querySelector(".tboard");
    if (!b) return;
    const top = b.getBoundingClientRect().top + window.scrollY;
    const pad = parseFloat(getComputedStyle($("main")).paddingBottom) || 0;
    b.style.height = Math.max(320, Math.floor(window.innerHeight - top - pad - 1)) + "px";
  }
  window.addEventListener("resize", fitBoard);

  function render() {
    const v = currentView();
    document.querySelectorAll("nav.tabs a").forEach((a) => a.classList.toggle("active", a.dataset.view === v));
    $("filters").style.display = v === "resumen" ? "none" : "";
    updateFilterUi();
    if (!lastLoaded) { if (token && loading) $("main").innerHTML = skeleton(); return; }
    const st = saveScroll();
    const rows = filtered();
    if (v === "tabla") renderTable(rows);
    else if (v === "tablero") renderTrello(rows);
    else if (v === "estado") renderBoard(rows);
    else if (v === "listas") renderMatrix(rows);
    else renderSummary();
    fitBoard();
    restoreScroll(st, v);
    render.lastView = v;
  }

  function renderTable(rows) {
    const key = sort.key, dir = sort.dir;
    const prioRank = { P1: 1, P2: 2, P3: 3, "—": 4 };
    const val = (c) => key === "who" ? who(c).toLowerCase() : key === "ncom" ? -(c.comments ? c.comments.length : 0) : key === "prio" ? prioRank[c.prio] : key === "list" ? c.listOrder : key === "last" ? (c.last ? -c.last : 0) : String(c[key] || "").toLowerCase();
    rows = rows.slice().sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
    const th = (k, l) => `<th data-sort="${k}">${l}${sort.key === k ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
    $("main").innerHTML = `<div class="count">${rows.length} tarjetas</div>` + (rows.length ? `<table class="cards"><thead><tr>
      ${th("caseId", "Caso")}${th("title", "Título")}${th("tipo", "Tipo")}${th("prio", "Prio")}${th("estado", "Estado")}${th("who", "Creada por")}${th("ncom", ic("chat", 1))}${th("list", "Lista")}${th("last", "Actividad")}
      </tr></thead><tbody>` + rows.map((c) => `<tr class="row${c.archived ? " isarch" : ""}" tabindex="0" data-id="${esc(c.id)}">
        <td class="case">${esc(c.caseId)}</td><td class="title">${c.archived ? `<span class="tag archtag">Archivada</span> ` : ""}${esc(c.title)}</td><td>${tagTipo(c)}</td><td>${tagPrio(c)}</td>
        <td>${tagEstado(c)}</td><td class="who">${esc(who(c))}</td><td class="ncom">${c.comments ? (c.comments.length ? ic("chat", 1) + " " + c.comments.length : "") : "…"}</td><td class="list">${esc(c.listShort)}</td><td class="date">${fmtDate(c.last)}</td></tr>`).join("") +
      `</tbody></table><p class="status">"Creada por" sale del historial de Trello. Si dice "(est.)", todavía no se cargó y es una estimación según la cuenta usada en la descripción.</p>` : emptyState());
  }

  const cardFoot = (c) => `${c.desc ? `<span title="Tiene descripción">${ic("text", 1)}</span>` : ""}${c.comments && c.comments.length ? `<span>${ic("chat", 1)} ${c.comments.length}</span>` : ""}${who(c) !== "—" ? `<span>${esc(who(c))}</span>` : ""}`;

  // Trello-like view: one column per list, cards in the same order as in Trello.
  const LCOLORS = { green: "#4bce97", yellow: "#f5cd47", orange: "#fea362", red: "#f87168", purple: "#9f8fef", blue: "#579dff", sky: "#6cc3e0", lime: "#94c748", pink: "#e774bb", black: "#8590a2" };
  const lcolor = (c) => LCOLORS[String(c || "").replace(/_(dark|light)$/, "")] || "#8590a2";
  function renderTrello(rows) {
    const shown = lists.filter((l) => !fsel.fLista.size || fsel.fLista.has(l.name));
    $("main").innerHTML = `<div class="tboard">` + shown.map((l) => {
      const cs = rows.filter((c) => c.listId === l.id).sort((a, b) => a.pos - b.pos);
      return `<div class="tlist"><h3><span>${esc(l.name)}</span><span class="status">${cs.length}</span></h3><div class="tcards" data-k="${esc(l.id)}">` +
        cs.map((c) => `<div class="tcard${c.archived ? " isarch" : ""}" tabindex="0" data-id="${esc(c.id)}">` +
          (c.archived ? `<span class="tag archtag">Archivada</span>` : "") +
          (c.cover ? `<img class="tcover" alt="" data-src="${esc(pickPreview(c.cover, 300))}" data-href="${esc(c.url)}">` : "") +
          (c.labelObjs.length ? `<div class="lbls">${c.labelObjs.map((x) => `<span class="lbl" style="background:${lcolor(x.color)}" title="${esc(x.name)}"></span>`).join("")}</div>` : "") +
          `<div class="n">${esc(c.name)}</div><div class="badges">${cardFoot(c)}</div></div>`).join("") +
        `</div><button class="tadd" data-newlist="${esc(l.id)}">${ic("plus", 1)} Añadí una tarjeta</button></div>`;
    }).join("") + `</div>`;
    fillImages($("main"));
  }

  // "Por estado": the same kind of board, with one column per state.
  function renderBoard(rows) {
    const open = (c) => c.estado !== "Rechequear" && c.estado !== "FIXED";
    const cols = [
      ["Rechequear", (c) => c.estado === "Rechequear", "rech"],
      ["FIXED", (c) => c.estado === "FIXED", "fixed"],
      ["BUG reportado", (c) => c.estado === "Reportado" && c.tipo === "BUG", "rep"],
      ["BUG sin reportar", (c) => c.estado === "Sin etiqueta" && c.tipo === "BUG", "bug"],
      ["Bloqueado", (c) => open(c) && (c.tipo === "Bloqueado" || c.extra.includes("Bloqueado")), "bloq"],
      ["Duda", (c) => open(c) && c.tipo === "Duda", "duda"],
      ["Parcial", (c) => open(c) && c.tipo === "Parcial", "parcial"],
      ["Mejora", (c) => open(c) && c.tipo === "Mejora", "mejora"],
      ["Pendientes / Resumen", (c) => c.tipo === "Índice", "idx"],
    ];
    $("main").innerHTML = `<div class="tboard">` + cols.map(([t, f, k]) => {
      const cs = rows.filter(f);
      if (k === "idx" && hideIdx()) return "";
      return `<div class="tlist kc k-${k}"><h3><span>${esc(t)}</span><span class="n">${cs.length}</span></h3><div class="tcards" data-k="${k}">` +
        cs.map((c) => `<div class="tcard" tabindex="0" data-id="${esc(c.id)}"><div class="c">${esc(c.caseId)} · ${esc(c.listShort)}</div>
          <div class="n">${esc(c.title)}</div><div class="foot">${tagPrio(c)}${cardFoot(c)}</div></div>`).join("") +
        (cs.length ? "" : `<p class="meta" style="margin:4px 2px">Nada por acá.</p>`) + `</div></div>`;
    }).join("") + `</div>`;
  }

  function renderMatrix(rows) {
    const types = ["BUG", "Mejora", "Duda", "Bloqueado", "Parcial", "Índice", "Otro"];
    const byList = lists.map((l) => {
      const cs = rows.filter((c) => c.list === l.name);
      return { l, cs, n: types.map((t) => cs.filter((c) => c.tipo === t).length), rech: cs.filter((c) => c.estado === "Rechequear").length, p1: cs.filter((c) => c.prio === "P1").length };
    }).filter((x) => x.cs.length);

      byList.map((x) => `<tr class="row" tabindex="0" data-list="${esc(x.l.name)}"><td>${esc(x.l.name)}</td>${x.n.map(cell).join("")}${cell(x.p1)}${cell(x.rech)}${cell(x.cs.length)}</tr>`).join("") +
      `</tbody></table></div><p class="status">Tocá una fila para ver sus tarjetas en la tabla.</p>` : emptyState();
  }

  let weekStats = null; // { created, fixed } over the last 7 days, from the board history
  const daysSince = (d) => (d ? Math.floor((Date.now() - d) / 86400000) : null);
  function renderSummary() {
    const open = cards.filter((c) => c.tipo !== "Índice");
    // Each KPI opens the table with the matching filters; BUG P1 and Rechequear stand out when > 0.
    const k = (l, v, f, hot) => `<button class="kpi${hot && v ? " hot k-" + hot : ""}" data-f="${esc(JSON.stringify(f))}" ${v ? "" : "disabled"} title="${v ? "Ver en la tabla" : ""}"><div class="v">${v}</div><div class="l">${l}</div></button>`;

      .sort((a, b) => (b.d ?? -1) - (a.d ?? -1));
    const stale = rech.filter((x) => x.d !== null && x.d >= STALE_DAYS).length;

    $("main").innerHTML = `<div class="kpis">` +

      k("Para rechequear", n((c) => c.estado === "Rechequear"), { fEstado: "Rechequear" }, "rech") +
      k("BUG P2", n((c) => c.tipo === "BUG" && c.prio === "P2"), { fTipo: "BUG", fPrio: "P2" }) +
      k("BUG P3", n((c) => c.tipo === "BUG" && c.prio === "P3"), { fTipo: "BUG", fPrio: "P3" }) +
      k("FIXED abiertas", n((c) => c.estado === "FIXED"), { fEstado: "FIXED" }) +
      k("Bloqueados", n((c) => c.tipo === "Bloqueado" || c.extra.includes("Bloqueado")), { fTipo: "Bloqueado" }) +
      k("Dudas", n((c) => c.tipo === "Duda" || c.extra.includes("Duda")), { fTipo: "Duda" }) +
      k("Mejoras", n((c) => c.tipo === "Mejora"), { fTipo: "Mejora" }) +
      k("Tarjetas (sin índices)", open.length, {}) +
      k("Pendientes / Resumen", cards.length - open.length, { fTipo: "Índice" }) +
      `</div><h3 class="sec">Últimos 7 días</h3><div class="kpis">` +
      kStatic("Tarjetas creadas", ws ? ws.created : "…", "Incluye las que después se archivaron.") +
      kStatic("Pasaron a FIXED", ws ? ws.fixed : "…", "Tarjetas a las que se les puso la etiqueta FIXED en los últimos 7 días.") +
      `</div><h3 class="sec">Esperando rechequeo${stale ? ` · <span style="color:var(--danger)">${stale} con más de ${STALE_DAYS} días</span>` : ""}</h3>` +
      (rech.length ? `<div class="hscroll"><table class="matrix"><thead><tr><th>Caso</th><th>Título</th><th>Creada por</th><th class="num">Días en Rechequear</th></tr></thead><tbody>` +
        rech.map(({ c, d }) => `<tr class="row" tabindex="0" data-id="${esc(c.id)}"><td class="case">${esc(c.caseId)}</td><td>${esc(c.title)}</td><td>${esc(who(c))}</td><td class="num">${d === null ? `<span class="days" title="${ws ? "El cambio es anterior al historial que lee la página" : "Leyendo historial…"}">—</span>` : `<span class="days${d >= STALE_DAYS ? " old" : ""}">${d}</span>`}</td></tr>`).join("") +
        `</tbody></table></div>` : `<p class="meta">No hay tarjetas esperando rechequeo.</p>`) +
      `<h3 class="sec" style="margin-top:22px">Por quién la creó</h3><div class="hscroll"><table class="matrix"><thead><tr><th>Creada por</th><th class="num">BUG</th><th class="num">Duda</th><th class="num">Mejora</th><th class="num">Bloqueado</th><th class="num">Rechequear</th></tr></thead><tbody>` +
      [...new Set(open.map(who))].sort().map((t) => {
        const cs = open.filter((c) => who(c) === t);
        const c2 = (f) => { const v = cs.filter(f).length; return `<td class="num ${v ? "" : "zero"}">${v || "·"}</td>`; };
        return `<tr class="row" tabindex="0" data-f="${esc(JSON.stringify({ fTester: t }))}"><td>${esc(t)}</td>${c2((c) => c.tipo === "BUG")}${c2((c) => c.tipo === "Duda")}${c2((c) => c.tipo === "Mejora")}${c2((c) => c.tipo === "Bloqueado")}${c2((c) => c.estado === "Rechequear")}</tr>`;

  // ---------- drawer ----------
  function mdLite(s) {
    let h = esc(s);
    h = h.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, (m, alt, u) => `<a href="${u}" target="_blank" rel="noopener">[imagen adjunta]</a>`);
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s"]+)(?:\s+&quot;[^)]*&quot;)?\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return h.replace(/\n/g, "<br>");
  }
  // Card descriptions follow the house template ("**Campo:** valor"): show them as a two-column sheet.
  function descView(src) {
    const F = /^\s*\*\*([^*\n]{1,40}?):\*\*\s*(.*)$/;
    const lead = [], fields = [];
    let cur = null;
    for (const ln of String(src || "").split("\n")) {
      const m = ln.match(F);
      if (m) { cur = { k: m[1], v: [m[2]] }; fields.push(cur); }
      else if (cur) cur.v.push(ln);
      else lead.push(ln);
    }
    if (fields.length < 3) return mdLite(src);
    const LI = /^\s*(?:(\d+)[.)]|[-*•])\s?(.*)$/;
    const value = (lines) => {
      const ls = lines.map((x) => x.trimEnd()).filter((x) => x.trim());
      const items = ls.map((x) => x.match(LI));
      if (ls.length && items.every(Boolean)) {
        const filled = items.filter((m) => m[2].trim());
        if (!filled.length) return "";
        const tag = items[0][1] ? "ol" : "ul";
        return `<${tag}>${filled.map((m) => `<li>${mdLite(m[2].trim())}</li>`).join("")}</${tag}>`;
      }
      return mdLite(ls.join("\n").trim());
    };
    const leadTxt = lead.join("\n").trim();
    return (leadTxt ? `<p class="lead">${mdLite(leadTxt)}</p>` : "") + `<dl class="ficha">` + fields.map((f) => {
      const v = value(f.v);
      return `<dt>${esc(f.k)}</dt>` + (v ? `<dd>${v}</dd>` : `<dd class="empty-f">—</dd>`);
    }).join("") + `</dl>`;
  }
  // ---------- drawer open/close (with #view/<card> in the URL) ----------
  let drawerPushed = false, lastFocus = null;
  const drawerOpen = () => $("drawer").classList.contains("open");
  function closeDrawer(fromHash) {
    if (!drawerOpen()) return;

    document.querySelectorAll("#drawer details[open]").forEach((d) => (d.open = false));
    if (!fromHash && route().card) {
      if (drawerPushed) history.back();
      else history.replaceState(null, "", "#" + currentView());
    }
    drawerPushed = false;
    const back = lastFocus && document.contains(lastFocus) ? lastFocus : openCardId && $("main").querySelector(`[data-id="${CSS.escape(openCardId)}"]`);
    if (back) back.focus({ preventScroll: true });
  }

    $("drawer").innerHTML = `<div class="dtop"><span class="case">${esc(c.caseId)}</span> · <span>${esc(c.list)}</span><span class="grow"></span>
        <button id="copyLink" class="iconbtn" title="Copiar link a esta tarjeta" aria-label="Copiar link">${ic("link")}</button>
        <a class="iconbtn" href="${esc(c.url)}" target="_blank" rel="noopener" title="Abrir en Trello" aria-label="Abrir en Trello">${ic("ext")}</a>
        ${c.archived ? "" : `<button data-act="archive" class="iconbtn arch" title="Archivar tarjeta" aria-label="Archivar tarjeta">${ic("archive")}</button>`}
        <button id="close" class="iconbtn" aria-label="Cerrar" title="Cerrar (Esc)">${ic("x")}</button></div>
      <h2 tabindex="-1">${esc(c.title || c.name)}</h2>
      <div>${tagTipo(c)}${tagPrio(c)}${tagEstado(c)}</div>
      <p class="meta" id="dmeta">${dmeta(c)}</p>

      <div class="abar"${c.archived ? " hidden" : ""}>
        <div class="arow" role="group" aria-label="Estado">
          ${STATE_LABELS.map((s) => `<button data-act="state" data-v="${s}" class="st ${c.estado === s ? "on" : ""}" ${chipStyle(s)} aria-pressed="${c.estado === s}">${s}</button>`).join("")}
          <button data-act="state" data-v="" title="Quitar el estado" ${c.estado === "Sin etiqueta" ? "disabled" : ""}>Sin estado</button></div>
        <span class="sep"></span>

          ${EDIT_LABELS.map((l) => `<label class="lchk chip" ${chipStyle(l)}><input type="checkbox" data-lab="${l}" ${mine(l) ? "checked" : ""}>${l}</label>`).join("")}</div></details>
        <details class="dd"><summary>Mover ${ic("chevron", 1)}</summary><div class="ddm">
          ${lists.map((l) => l.id === c.listId ? `<div class="opt cur">${esc(l.name)} (actual)</div>` : `<button class="opt" data-act="move" data-v="${esc(l.id)}">${esc(l.name)}</button>`).join("")}</div></details>
      </div>
      <div id="actMsg" class="status"></div>
      <div class="desc">${descView(c.desc) || "<i>Sin descripción</i>"}</div>
      <h3 class="ctitle">${ic("clip")} Adjuntos</h3>
      <div id="atts" class="atts"><p class="meta">Cargando adjuntos…</p></div>
      <div class="drop" id="drop">${ic("upload")} Arrastrá capturas acá, pegalas con <b>Ctrl+V</b> o <a href="#" id="pickFile">elegí archivos</a>
        <input type="file" id="fileIn" accept="image/*,video/*,.pdf,.txt,.log,.har,.json" multiple hidden></div>
      <div id="upMsg" class="status"></div>
      <h3 class="ctitle">${ic("chat")} Comentarios</h3>
      <div class="newcmt"><div class="mwrap"><textarea id="cmtText" placeholder="Escribí un comentario… (escribí @ para mencionar)"></textarea></div>
        <div class="mbtns" style="margin-top:6px"><span id="cmtMsg" class="status" style="flex:1"></span><button id="cmtSend" class="primary">Comentar</button></div></div>
      <div id="comments">${renderComments(c)}</div>`;
    $("drawer").classList.add("open");
    $("drawer").scrollTop = keepTop;
    if (draft) $("cmtText").value = draft;
    if (!same) $("drawer").querySelector("h2").focus({ preventScroll: true });
    $("close").onclick = () => closeDrawer();
    $("copyLink").onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); showToast("Link copiado. Quien lo abra ve esta tarjeta (tiene que estar conectado a Trello)."); }
      catch (e) { showToast("No se pudo copiar. Copiá la dirección de la barra del navegador."); }
    };
    $("drawer").querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => planAction(c, b.dataset.act, b.dataset.v)));
    $("drawer").querySelectorAll("[data-lab]").forEach((cb) => (cb.onchange = () => planAction(c, "label", cb.dataset.lab, cb.checked)));
    $("drawer").querySelectorAll(".abar details").forEach((d) => d.addEventListener("toggle", () => { if (d.open) $("drawer").querySelectorAll(".abar details").forEach((o) => o !== d && (o.open = false)); }));
    openCardId = c.id;
    attachMentions($("cmtText"));
    wireComments(c);
    $("pickFile").onclick = (ev) => { ev.preventDefault(); $("fileIn").click(); };
    $("fileIn").onchange = () => { const f = [...$("fileIn").files]; $("fileIn").value = ""; uploadToCard(c, f); };
    loadAttachments(c);
    $("cmtSend").onclick = () => {
      const text = $("cmtText").value.trim();
      if (!text) { $("cmtMsg").textContent = "Escribí el comentario."; return; }
      confirmBox(`<h3>Comentar en la tarjeta</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p><div class="cmt">${mdLite(text)}</div><p class="meta">Se publica en Trello con tu nombre y lo ven todos los del tablero. Las menciones (@usuario) le llegan como notificación.</p>`,
        () => postComment(c, text));
    };
    fetchActivity(c, true).then(() => {
      if (!$("drawer").classList.contains("open") || !$("comments")) return;
      $("comments").innerHTML = renderComments(c); wireComments(c);
      if ($("dmeta") && openCardId === c.id) $("dmeta").innerHTML = dmeta(c);
    }).catch((e) => { if ($("comments")) $("comments").innerHTML = `<p class="meta">No se pudieron leer los comentarios: ${esc(errText(e))}</p>`; });
  }

  const dmeta = (c) => `${c.creator ? `Creada por <b>${esc(c.creator)}</b> el ${c.created.toLocaleString("es-AR")}` : `Creada por: ${esc(who(c))}`} · última actividad ${c.last ? c.last.toLocaleString("es-AR") : "—"}`;
  async function postComment(c, text) {
    const btn = $("cmtSend");
    btn.disabled = true;
    $("cmtMsg").textContent = "Publicando…";
    try {
      await api("POST", `/cards/${c.id}/actions/comments`, { text });
    } catch (e) {
      $("cmtMsg").textContent = writeErr(e);
      btn.disabled = false;
      return;
    }
    $("cmtText").value = "";
    $("cmtMsg").textContent = "✓ Comentario publicado.";
    btn.disabled = false;
    try { await fetchActivity(c, true); } catch (e) {}
    if ($("comments")) { $("comments").innerHTML = renderComments(c); wireComments(c); }
    render();
  }

  function renderComments(c) {
    if (!c.comments) return `<p class="meta">Cargando comentarios…</p>`;
    if (!c.comments.length) return `<p class="meta">Sin comentarios.</p>`;
    return c.comments.map((m, i) => `<div class="cmt" data-ci="${i}"><div class="cmeta"><b>${esc(m.author)}</b> · ${m.date.toLocaleString("es-AR")}${m.edited ? " (editado)" : ""}${me && m.authorId === me.id && m.id ? ` · <a href="#" class="cedit" data-ci="${i}">Editar</a> · <a href="#" class="cdel" data-ci="${i}">Borrar</a>` : ""}</div><div class="cbody">${mdLite(m.text)}</div></div>`).join("");
  }

  function wireComments(c) {
    const box = $("comments");
    if (!box || !c.comments) return;
    box.querySelectorAll("a.cdel").forEach((a) => (a.onclick = (ev) => {
      ev.preventDefault();
      const m = c.comments[+a.dataset.ci];
      confirmBox(`<h3>Borrar tu comentario</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p><div class="cmt">${mdLite(m.text)}</div><p class="warnTxt">Se borra de Trello para todos y no se puede recuperar.</p>`,
        async () => {
          const meta = box.querySelector(`.cmt[data-ci="${a.dataset.ci}"] .cmeta`);
          if (meta) meta.insertAdjacentHTML("beforeend", " · Borrando…");
          try { await api("DELETE", `/actions/${m.id}`); }
          catch (e) { if (meta) meta.insertAdjacentHTML("beforeend", " " + esc(writeErr(e))); return; }
          try { await fetchActivity(c, true); } catch (e) { c.comments = c.comments.filter((x) => x.id !== m.id); }
          box.innerHTML = renderComments(c); wireComments(c);
          render();
        });
    }));
    box.querySelectorAll("a.cedit").forEach((a) => (a.onclick = (ev) => {
      ev.preventDefault();
      const m = c.comments[+a.dataset.ci];
      const div = box.querySelector(`.cmt[data-ci="${a.dataset.ci}"] .cbody`);
      div.innerHTML = `<div class="mwrap"><textarea class="cedtxt">${esc(m.text)}</textarea></div>
        <div class="mbtns" style="margin-top:6px"><span class="status cedmsg" style="flex:1"></span><button class="cedno">Cancelar</button><button class="cedok primary">Guardar</button></div>`;
      const ta = div.querySelector("textarea");
      attachMentions(ta);
      ta.focus();
      div.querySelector(".cedno").onclick = () => { box.innerHTML = renderComments(c); wireComments(c); };
      div.querySelector(".cedok").onclick = () => {
        const text = ta.value.trim();
        if (!text) { div.querySelector(".cedmsg").textContent = "El comentario no puede quedar vacío."; return; }
        if (text === m.text) { div.querySelector(".cedmsg").textContent = "No hay cambios."; return; }
        confirmBox(`<h3>Editar tu comentario</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p><div class="cmt">${mdLite(text)}</div><p class="meta">Reemplaza el texto en Trello y queda marcado como editado.</p>`,
          async () => {
            const msg = div.querySelector(".cedmsg");
            msg.textContent = "Guardando…";
            try {
              await api("PUT", `/actions/${m.id}`, { text });
            } catch (e) { msg.textContent = writeErr(e); return; }
            try { await fetchActivity(c, true); } catch (e) {}
            box.innerHTML = renderComments(c); wireComments(c);
          });
      };
    }));
  }

  // ---------- members + @mention autocomplete ----------
  async function loadMembers() {
    try {
      const [mp, mine] = await Promise.all([
        api("GET", `/boards/${BOARD_ID}/members`, { fields: "fullName,username" }),
        api("GET", "/members/me", { fields: "fullName,username" }),
      ]);
      members = mp || [];
      me = mine;
      $("who").textContent = me ? me.fullName : "";
      $("avatar").textContent = me ? initials(me.fullName) : "·";
      $("userMenu").querySelector("summary").title = me ? me.fullName : "";
      if ($("drawer").classList.contains("open") && $("comments") && openCardId) {
        const c = cards.find((x) => x.id === openCardId);
        if (c) { $("comments").innerHTML = renderComments(c); wireComments(c); }
      }
    } catch (e) { /* without members: no autocomplete and no edit links */ }
  }
  const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function attachMentions(ta) {
    const pop = document.createElement("div");
    pop.className = "mpop";
    ta.parentNode.appendChild(pop);
    let items = [], sel = 0, start = -1;
    const close = () => { pop.style.display = "none"; items = []; start = -1; };
    const show = () => {
      if (!items.length) return close();
      pop.innerHTML = items.map((m, i) => `<div class="mitem ${i === sel ? "on" : ""}" data-i="${i}"><b>${esc(m.fullName)}</b> <span class="meta">@${esc(m.username)}</span></div>`).join("");
      pop.style.display = "block";
      pop.querySelectorAll(".mitem").forEach((d) => (d.onmousedown = (ev) => { ev.preventDefault(); pick(+d.dataset.i); }));
    };
    const pick = (i) => {
      const m = items[i]; if (!m) return;
      const pos = ta.selectionStart;
      ta.value = ta.value.slice(0, start) + "@" + m.username + " " + ta.value.slice(pos);
      const np = start + m.username.length + 2;
      ta.setSelectionRange(np, np);
      close(); ta.focus();
    };
    ta.addEventListener("input", () => {
      const pos = ta.selectionStart;
      const before = ta.value.slice(0, pos);
      const mm = before.match(/(^|\s)@([\w.\-À-ſ]*)$/);
      if (!mm || !members.length) return close();
      start = pos - mm[2].length - 1;
      const q = norm(mm[2]);
      items = members.filter((m) => !q || norm(m.username).includes(q) || norm(m.fullName).split(/\s+/).some((w) => w.startsWith(q))).slice(0, 6);
      sel = 0; show();
    });
    ta.addEventListener("keydown", (ev) => {
      if (pop.style.display !== "block") return;
      if (ev.key === "ArrowDown") { ev.preventDefault(); sel = (sel + 1) % items.length; show(); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); sel = (sel - 1 + items.length) % items.length; show(); }
      else if (ev.key === "Enter" || ev.key === "Tab") { ev.preventDefault(); pick(sel); }
      else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); close(); }
    });
    ta.addEventListener("blur", () => setTimeout(close, 150));
  }

  // ---------- write actions ----------
  // State, labels and moves apply at once with "Deshacer" in a toast; archiving still asks first.
  function planAction(c, act, v, checked) {
    const ops = [];
    let what = "";
    if (act === "state") {
      if (v && !c.labelIds.includes(LABELS[v])) ops.push({ action: "attach_label", labelId: LABELS[v], label: v });
      STATE_LABELS.filter((s) => s !== v && c.labelIds.includes(LABELS[s])).forEach((s) => ops.push({ action: "detach_label", labelId: LABELS[s], label: s }));
      what = v ? `Estado: <b>${v}</b>` : "Se quitó el estado";
    } else if (act === "label") {
      const had = c.labelIds.includes(LABELS[v]);
      if (checked && !had) ops.push({ action: "attach_label", labelId: LABELS[v], label: v });
      if (!checked && had) ops.push({ action: "detach_label", labelId: LABELS[v], label: v });
      what = `${checked ? "Se agregó" : "Se quitó"} la etiqueta <b>${esc(v)}</b>`;
    } else if (act === "move") {
      if (v === c.listId) return;
      const to = (lists.find((l) => l.id === v) || {}).name;
      ops.push({ action: "move", listId: v, label: to, fromList: c.listId, fromPos: c.pos });
      what = `Movida a <b>${esc(to)}</b>`;
    } else if (act === "unarchive") {
      ops.push({ action: "unarchive", label: "desarchivar" });
      confirmBox(`<h3>Desarchivar la tarjeta</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p>${ownerNote(c)}<p class="meta">Vuelve a aparecer en el tablero para todos, en la lista «${esc(c.list)}».</p>`,
        () => runOps(c, ops, "Tarjeta desarchivada"), "Desarchivar");
      return;
    } else if (act === "archive") {
      ops.push({ action: "archive", label: "archivar" });
      confirmBox(`<h3>Archivar la tarjeta</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p>${ownerNote(c)}<p class="meta">Desaparece del tablero para todos. Se puede desarchivar desde Trello › Menú › Archivados.</p>`,
        () => runOps(c, ops, "Tarjeta archivada"), "Archivar");
      return;
    }
    if (!ops.length) return;
    runOps(c, ops, what, true);
  }
  function ownerNote(c, plain) {
    const owner = c.creator || (c.tester !== "—" ? c.tester : "");
    if (!owner || (me && owner === me.fullName)) return "";
    return plain ? ` · es de ${esc(owner)}` : `<p class="warnTxt">${ic("warn", 1)} Esta tarjeta es de <b>${esc(owner)}</b>. Hacelo solo con su OK.</p>`;
  }
  const invert = (ops) => ops.slice().reverse().map((o) =>
    o.action === "attach_label" ? { ...o, action: "detach_label" } :
    o.action === "detach_label" ? { ...o, action: "attach_label" } :
    { action: "move", listId: o.fromList, pos: o.fromPos, label: (lists.find((l) => l.id === o.fromList) || {}).name, fromList: o.listId, fromPos: "top" });

  // ---------- modal + toast ----------
  let modalReturn = null;
  const modalOpen = () => $("modal").classList.contains("open");

    closeModal();

  function confirmBox(html, onOk, okLabel) {

  function writeErr(e) {

  async function runOps(c, ops, what, undoable) {
    const msg = $("actMsg");
    const bar = $("drawer").querySelector(".abar");

    try {
      for (const o of ops) {
        if (!o.labelId && (o.action === "attach_label" || o.action === "detach_label")) throw { code: "http", message: `La etiqueta ${o.label} no existe en el tablero.` };
        if (o.action === "attach_label") await api("POST", `/cards/${c.id}/idLabels`, { value: o.labelId });
        else if (o.action === "detach_label") await api("DELETE", `/cards/${c.id}/idLabels/${o.labelId}`);
        else if (o.action === "move") await api("PUT", `/cards/${c.id}`, { idList: o.listId, pos: o.pos ?? "top" });
        else if (o.action === "archive") await api("PUT", `/cards/${c.id}`, { closed: "true" });

        done++;
      }
      const touched = new Set([c.listId]);

      showToast(`${what} · ${esc(c.caseId)}${ownerNote(c, true)}`, undo);
    } catch (e) {

  const TEMPLATES = {

  const TYPE_LABEL = { BUG: "BUG", Duda: "DUDA", Mejora: "MEJORA", Bloqueado: "BLOQUEADO" };

  function guessList(caso) {
    const code = (caso.match(/^[A-Z]+/) || [""])[0];
    if (!code) return "";
    const book = lists.find((l) => l.name.includes("(/book)") && new RegExp("^[\\dX]+\\.?\\s*" + code + "\\b").test(l.name));
    const sched = lists.find((l) => l.name.endsWith("(" + code + ")"));
    return (book || sched || {}).id || "";
  }

  function buildTitle(caso, tipo, txt) {

  }

  function findDups(caso, txt) {
    const words = (s) => new Set(s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/).filter((w) => w.length > 3));
    const tw = words(txt);
    return cards.filter((c) => c.tipo !== "Índice").map((c) => {
      let score = 0;
      if (caso && c.caseId.toUpperCase() === caso.trim().toUpperCase()) score += 3;
      if (tw.size) { const cw = words(c.title); let n = 0; tw.forEach((w) => cw.has(w) && n++); score += n >= 3 ? n : 0; }
      return { c, score };
    }).filter((x) => x.score >= 3).sort((a, b) => b.score - a.score).slice(0, 5).map((x) => x.c);
  }

  function openNewCard(presetList) {

    </div>`);
    setTimeout(() => $("ncCase") && $("ncCase").focus(), 0);
    pendingFiles = [];
    pendingCase = () => $("ncCase").value.trim();
    renderPending();
    $("ncPick").onclick = (ev) => { ev.preventDefault(); $("ncFile").click(); };
    $("ncFile").onchange = () => { addPending([...$("ncFile").files]); $("ncFile").value = ""; };
    let touched = false;
    const tipo = () => m.querySelector("input[name=ncTipo]:checked").value;
    const prio = () => m.querySelector("input[name=ncPrio]:checked").value;
    const refreshTpl = () => { if (!touched) $("ncDesc").value = TEMPLATES[tipo()](prio(), $("ncCase").value.trim() || "—"); };
    const refreshPrev = () => {
      $("ncPrev").textContent = $("ncTitle").value.trim() ? "Título final: " + buildTitle($("ncCase").value, tipo(), $("ncTitle").value) : "";
      const d = findDups($("ncCase").value, $("ncTitle").value);
      $("ncDups").innerHTML = d.length ? `<div class="dups">${ic("warn", 1)} Posibles duplicados (revisalos antes de crear):<br>${d.map((c) => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>`).join("<br>")}</div>` : "";
    };

    if (presetList) $("ncList").value = presetList;
    $("ncDesc").addEventListener("input", () => { touched = true; $("ncDesc").dataset.touched = "1"; });
    m.querySelectorAll("input[name=ncTipo], input[name=ncPrio]").forEach((r) => r.addEventListener("change", () => { refreshTpl(); refreshPrev(); }));
    $("ncCase").addEventListener("input", () => { if (!$("ncList").value || $("ncList").dataset.auto) { const g = guessList($("ncCase").value.trim().toUpperCase()); if (g) { $("ncList").value = g; $("ncList").dataset.auto = "1"; } } refreshTpl(); refreshPrev(); });
    $("ncList").addEventListener("change", () => delete $("ncList").dataset.auto);
    $("ncTitle").addEventListener("input", refreshPrev);
    $("ncCancel").onclick = dismissModal;

      const listId = $("ncList").value, title = $("ncTitle").value.trim();
      if (!listId) { $("ncMsg").textContent = "Elegí la lista."; return; }
      if (!title) { $("ncMsg").textContent = "Escribí el título."; return; }
      const data = { listId, listName: (lists.find((l) => l.id === listId) || {}).name, name: buildTitle($("ncCase").value, tipo(), title), desc: $("ncDesc").value, tipo: tipo(), prio: prio(), caso: $("ncCase").value.trim() };
      const btn = $("ncCreate");

  async function createCard(d) {
    const btn = $("ncCreate");
    btn.disabled = true; $("ncCancel").disabled = true;
    $("ncMsg").textContent = "Creando en Trello…";
    let card;
    try {
      const idLabels = [LABELS[TYPE_LABEL[d.tipo]], LABELS[d.prio]].filter(Boolean).join(",");
      card = await api("POST", "/cards", { idList: d.listId, name: d.name, desc: d.desc, pos: "top", idLabels });
    } catch (e) {
      $("ncMsg").textContent = writeErr(e);
      btn.disabled = false; $("ncCancel").disabled = false;
      return;
    }
    let ok = 0;
    const files = pendingFiles.slice();
    for (const f of files) {
      $("ncMsg").textContent = `Tarjeta creada. Subiendo adjuntos ${ok + 1}/${files.length}…`;
      try { await uploadOne(card.id, f); ok++; } catch (e) { break; }
    }
    pendingFiles = [];
    await reloadLists([d.listId]);
    closeModal();
    openCard(card.id);
    if ($("actMsg")) $("actMsg").textContent = files.length && ok < files.length
      ? `✓ Tarjeta creada, pero se subieron ${ok} de ${files.length} adjuntos. Subí los que faltan abajo, en Adjuntos.`
      : `✓ Tarjeta creada${ok ? ` con ${ok} adjunto(s)` : ""}.`;
  }

  // ---------- attachments: view + upload ----------
  const MAX_MB = 10;
  let pendingFiles = [];
  let pendingCase = () => "";
  const imgCache = new Map();
  let imgBlocked = false;
  function isImg(a) { return /^image\//.test(a.mimeType || "") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(a.name || a.url || ""); }
  function pickPreview(a, w) {
    const ps = (a.previews || []).filter((p) => p.url).sort((x, y) => x.width - y.width);
    return ((ps.find((p) => p.width >= w) || ps[ps.length - 1]) || {}).url || a.url;
  }
  // Trello serves uploaded files only to authenticated requests. Several ways are tried, and the first one
  // that works is remembered for the rest of the images.
  // The method that worked last time is remembered, so it is tried first on the next visit.
  let imgMode = null;
  try { imgMode = localStorage.getItem("lgx-img-mode") || null; } catch (e) {}
  let imgFails = 0;
  const imgDiag = [];
  window.lgxImgDiag = imgDiag;
  const apiHost = (u) => u.replace(/^https:\/\/trello\.com\/1\//, "https://api.trello.com/1/");
  async function viaFetch(u) {
    const res = await fetch(u, { headers: { Authorization: `OAuth oauth_consumer_key="${TRELLO_KEY}", oauth_token="${token}"` } });
    if (!res.ok) throw { code: "http", status: res.status };
    const b = await res.blob();
    if (!/^image\//.test(b.type)) throw { code: "no es imagen (" + (b.type || "?") + ")" };
    return URL.createObjectURL(b);
  }
  function viaQuery(u) {
    return new Promise((ok, ko) => {
      const url = new URL(apiHost(u));
      url.searchParams.set("key", TRELLO_KEY);
      url.searchParams.set("token", token);
      const im = new Image();
      im.onload = () => ok(url.href);
      im.onerror = () => ko({ code: "img" });
      im.src = url.href;
    });
  }
  // Plain <img>: works only if the browser sends the Trello session cookie along.
  function viaCookie(u) {
    return new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(u); im.onerror = () => ko({ code: "img" }); im.src = u; });
  }
  const IMG_METHODS = { api: (u) => viaFetch(apiHost(u)), web: (u) => viaFetch(u), query: viaQuery, cookie: viaCookie };
  let probed = false;
  // Diagnostic only: does Trello answer with a redirect (to a file server) or directly?
  async function probe(u) {
    if (probed) return; probed = true;
    try {
      const r = await fetch(apiHost(u), { redirect: "manual", headers: { Authorization: `OAuth oauth_consumer_key="${TRELLO_KEY}", oauth_token="${token}"` } });
      imgDiag.push(`probe: ${r.type === "opaqueredirect" ? "redirect" : r.status + " " + (r.headers.get("content-type") || "")}`);
    } catch (e) { imgDiag.push(`probe: ${e && e.message || e}`); }
  }
  function showImgDiag() {
    if (showImgDiag.done) return; showImgDiag.done = true;
    const box = document.createElement("div");
    box.className = "banner warn";
    box.innerHTML = `Las fotos no se pueden mostrar en esta página todavía. Mandale esta línea a Gero: <code>${esc([...new Set(imgDiag)].join(" · ") || "sin datos")}</code>`;
    $("banner").appendChild(box);
  }
  function imgUrl(src) {
    if (imgCache.has(src)) return imgCache.get(src);
    const pr = (async () => {
      await probe(src);
      let last;
      // Try the method that worked before first, but never only that one: a session cookie can expire.
      const order = Object.keys(IMG_METHODS).sort((a, b) => (b === imgMode) - (a === imgMode));
      for (const m of order) {
        try {
          const u = await IMG_METHODS[m](src);
          if (imgMode !== m) { imgMode = m; try { localStorage.setItem("lgx-img-mode", m); } catch (e) {} }
          imgFails = 0; imgBlocked = false;
          return u;
        }
        catch (e) {
          last = e;
          const why = e && (e.status || e.code) || (e && e.message) || String(e);
          if (imgDiag.length < 12) imgDiag.push(`${m}: ${why}`);
        }
      }
      throw last || { code: "img" };
    })();
    imgCache.set(src, pr);
    pr.catch(() => imgCache.delete(src));
    return pr;
  }
  function imgFallback(el) {
    const a = document.createElement("a");
    a.href = el.dataset.href || "#"; a.target = "_blank"; a.rel = "noopener"; a.className = "imgfail"; a.innerHTML = ic("image", 1) + " Ver imagen en Trello";
    a.onclick = (ev) => ev.stopPropagation();
    el.replaceWith(a);
  }
  async function fillImages(root) {
    const els = [...root.querySelectorAll("img[data-src]")];
    await pool(els, 3, async (el) => {
      const src = el.dataset.src; el.removeAttribute("data-src");
      if (imgBlocked) return imgFallback(el);
      try { el.src = await imgUrl(src); }
      // One broken image (deleted file, odd type) must not hide the rest: give up only after 3 in a row fail.
      catch (e) { if (++imgFails >= 3) { imgBlocked = true; showImgDiag(); } imgFallback(el); }
    });
  }
  function showImage(src, href) {
    openModal(`<div class="mbox wide" style="text-align:center" role="dialog" aria-modal="true"><img id="lbImg" alt="" style="max-width:100%;max-height:76vh;border-radius:8px"><div class="mbtns"><a href="${esc(href)}" target="_blank" rel="noopener" style="margin-right:auto;color:var(--accent)">Abrir en Trello ${ic("ext", 1)}</a><button id="lbClose">Cerrar</button></div></div>`);
    $("lbClose").onclick = closeModal;
    $("lbClose").focus();
    imgUrl(src).then((u) => { if ($("lbImg")) $("lbImg").src = u; }).catch(() => { const el = $("lbImg"); if (el) { el.dataset.href = href; imgFallback(el); } });
  }
  async function loadAttachments(c) {
    let atts;
    try { atts = await api("GET", `/cards/${c.id}/attachments`, { fields: ATT_FIELDS }); }
    catch (e) { if ($("atts") && openCardId === c.id) $("atts").innerHTML = `<p class="meta">No se pudieron leer los adjuntos: ${esc(errText(e))}</p>`; return; }
    if (!$("atts") || openCardId !== c.id) return;
    atts = (atts || []).sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!atts.length) { $("atts").innerHTML = `<p class="meta">Sin adjuntos.</p>`; return; }
    $("atts").innerHTML = atts.map((a, i) => a.isUpload && isImg(a)
      ? `<a class="att" data-ai="${i}" title="${esc(a.name)}"><img alt="" data-src="${esc(pickPreview(a, 260))}" data-href="${esc(a.url)}">${esc(a.name)}</a>`
      : `<a class="att file" href="${esc(a.url)}" target="_blank" rel="noopener">${ic("file", 1)}&nbsp;${esc(a.name || a.url)}</a>`).join("");
    $("atts").querySelectorAll("a[data-ai]").forEach((el) => (el.onclick = (ev) => { ev.preventDefault(); const a = atts[+el.dataset.ai]; showImage(a.url, a.url); }));

  }
  function stamp() { const d = new Date(), z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
  // Pasted screenshots arrive as "image.png": give them a useful name (case + time).
  function named(files, caso) {
    return files.map((f, i) => {
      if (f.name && f.name !== "image.png") return f;
      const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
      return new File([f], `${caso && caso !== "—" ? caso + "-" : ""}captura-${stamp()}${files.length > 1 ? "-" + (i + 1) : ""}.${ext}`, { type: f.type });
    });
  }
  const tooBig = (f) => f.size > MAX_MB * 1024 * 1024;
  const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  async function uploadOne(cardId, f) {

  function uploadToCard(c, files) {

    if (big.length) { $("upMsg").textContent = `No se puede subir: ${big.map((f) => f.name).join(", ")} pesa más de ${MAX_MB} MB (límite de Trello gratis).`; return; }
    confirmBox(`<h3>Subir ${files.length} adjunto(s)</h3><p class="meta">${esc(c.caseId)} · ${esc(c.title)}</p><p>${files.map((f) => `${ic("clip", 1)} ${esc(f.name)} <span class="meta">(${kb(f.size)})</span>`).join("<br>")}</p><p class="meta">Se suben a la tarjeta en Trello y los ve todo el tablero.</p>`, async () => {

      }

    });
  }
  function addPending(files) {

  }
  function renderPending(msg) {
    const box = $("ncFiles"); if (!box) return;
    box.innerHTML = pendingFiles.map((f, i) => `<span class="pfile">${ic("clip", 1)} ${esc(f.name)} <span class="meta">${kb(f.size)}</span> <a href="#" data-rm="${i}" title="Quitar" aria-label="Quitar">${ic("x", 1)}</a></span>`).join("") + (msg ? `<div class="warnTxt">${esc(msg)}</div>` : "");
    box.querySelectorAll("a[data-rm]").forEach((a) => (a.onclick = (ev) => { ev.preventDefault(); pendingFiles.splice(+a.dataset.rm, 1); renderPending(); }));

  const filesOf = (dt) => dt ? [...(dt.files || [])].concat(dt.files && dt.files.length ? [] : [...(dt.items || [])].filter((it) => it.kind === "file").map((it) => it.getAsFile())).filter(Boolean) : [];
  const newCardOpen = () => $("modal").classList.contains("open") && !!$("ncFiles");
  const newCardDirty = () => !!($("ncTitle") && ($("ncTitle").value.trim() || $("ncCase").value.trim() || $("ncDesc").dataset.touched)) || pendingFiles.length > 0;
  document.addEventListener("paste", (e) => {

  // ---------- activity: creator + comments ----------
  const activityCache = new Map();
  function keepActivity(arr) {
    arr.forEach((c) => {
      const a = activityCache.get(c.id);
      if (!a) return;
      if (c.last && a.seenLast && c.last > a.seenLast) Object.assign(c, { creator: a.creator, created: a.created, labelAdded: a.labelAdded });
      else Object.assign(c, a);
    });
    return arr;
  }
  const emptyAct = () => ({ creator: null, created: null, comments: [], labelAdded: {} });
  // Collect creator + comments from Trello actions, grouped by card id.
  function collect(byCard, a) {
    const id = a.data && a.data.card && a.data.card.id;
    if (!id) return;
    if (!byCard.has(id)) byCard.set(id, emptyAct());
    const d = byCard.get(id);
    const who = (a.memberCreator && a.memberCreator.fullName) || "?";
    if (a.type === "commentCard") d.comments.push({ id: a.id, authorId: a.idMemberCreator, author: who, date: new Date(a.date), text: (a.data && a.data.text) || "", edited: !!(a.data && a.data.dateLastEdited) });
    else if (a.type === "addLabelToCard") {
      // Latest time each label was added (used for "days in Rechequear" and "moved to FIXED this week").
      const ln = String((a.data && a.data.label && a.data.label.name) || "").toUpperCase(), t = new Date(a.date);
      if (ln && (!d.labelAdded[ln] || t > d.labelAdded[ln])) d.labelAdded[ln] = t;
    }
    else { d.creator = who; d.created = new Date(a.date); }
  }
  function applyActivity(c, d) {
    const data = { creator: d.creator, created: d.created, comments: d.comments.sort((x, y) => y.date - x.date), labelAdded: d.labelAdded || {}, seenLast: c.last || null };
    activityCache.set(c.id, data);
    Object.assign(c, data);
    cards.filter((x) => x.id === c.id && x !== c).forEach((x) => Object.assign(x, data));
    return data;
  }
  async function fetchActivity(c) {
    const acts = await api("GET", `/cards/${c.id}/actions`, { filter: ACT_FILTER, limit: 1000, memberCreator_fields: "fullName,username" });
    const byCard = new Map();
    (acts || []).forEach((a) => collect(byCard, a));
    return applyActivity(c, byCard.get(c.id) || emptyAct());
  }
  let activityRun = 0;
  // Whole board history in 1-2 calls (1000 actions per page), instead of one call per card.
  async function loadAllActivity() {
    const run = ++activityRun;
    const byCard = new Map();
    let before = null, pages = 0;
    statusBusy = true;
    try {
      do {
        const params = { filter: ACT_FILTER, limit: 1000, memberCreator_fields: "fullName,username" };
        if (before) params.before = before;
        const acts = (await api("GET", `/boards/${BOARD_ID}/actions`, params)) || [];
        acts.forEach((a) => collect(byCard, a));
        before = acts.length === 1000 ? acts[acts.length - 1].id : null;
        pages++;
        $("status").textContent = `${cards.length} tarjetas · leyendo historial (${pages})…`;
      } while (before && pages < 20 && run === activityRun);
    } catch (e) {
      statusBusy = false;
      if (run !== activityRun) return;
      if (e && e.code === "unauthorized") return authFailed();
      showBanner(`No se pudieron cargar autores y comentarios: ${esc(errText(e))} <button id="resumeAct">Reintentar</button>`, "warn");
      const rb = $("resumeAct"); if (rb) rb.onclick = () => { showBanner(""); loadAllActivity(); };
      updateStatus();
      return;
    }
    statusBusy = false;
    if (run !== activityRun) return;
    lastByCard = byCard;
    cards.concat(archived).forEach((c) => applyActivity(c, byCard.get(c.id) || emptyAct()));
    const weekAgo = Date.now() - 7 * 86400000;
    weekStats = { created: 0, fixed: 0 };
    byCard.forEach((d) => { if (d.created && d.created >= weekAgo) weekStats.created++; if (d.labelAdded.FIXED && d.labelAdded.FIXED >= weekAgo) weekStats.fixed++; });
    fillFilters();
    render();
    updateStatus();
  }

  async function reloadLists(ids) {
    for (const id of ids) {
      try {
        const cp = await api("GET", `/lists/${id}/cards`, { fields: CARD_FIELDS, ...COVER_Q })
          .catch((e) => e && e.status === 400 ? api("GET", `/lists/${id}/cards`, { fields: CARD_FIELDS }) : Promise.reject(e));
        const nodes = (cp || []).filter((x) => !x.closed).map(mapCard).map(classify);
        const order = new Map(lists.map((l, i) => [l.name, i]));
        nodes.forEach((x) => (x.listOrder = order.has(x.list) ? order.get(x.list) : 999));
        cards = cards.filter((x) => x.listId !== id).concat(keepActivity(nodes));
      } catch (e) { showBanner("El cambio se guardó, pero no se pudo releer la lista. Tocá Actualizar (arriba a la derecha).", "warn"); }
    }
    lastLoaded = new Date();
    updateStatus();
    render();
  }

  // ---------- events ----------

    if (el.matches("tr[data-list]")) { fsel.fLista = new Set([el.dataset.list]); renderFdds(); saveFilters(); location.hash = "tabla"; return true; }
    if (el.matches("[data-f]")) { if (!el.disabled) applyFilters(JSON.parse(el.dataset.f)); return true; }

  // Open a card from a notification inside the page. If it isn't loaded yet (new, or the board hasn't

  async function openCardAnywhere(card) {
    if (cards.some((c) => c.id === card.id)) return openCard(card.id);
    const link = `https://trello.com/c/${esc(card.shortLink || card.id)}`;
    let full = null;
    try { full = await api("GET", `/cards/${card.id}`, { fields: "idBoard,idList,closed,name" }); } catch (e) {}

  // ---------- theme: system -> light -> dark ----------
  const THEMES = ["system", "light", "dark"];
  const THEME_UI = { system: ["monitor", "Tema del sistema"], light: ["sun", "Tema claro"], dark: ["moon", "Tema oscuro"] };
  function savedTheme() { try { const t = localStorage.getItem("lgx-theme"); return THEMES.includes(t) ? t : "system"; } catch (e) { return "system"; } }
  function applyTheme(t) {
    const root = document.documentElement;
    if (t === "system") delete root.dataset.theme; else root.dataset.theme = t;
    try { if (t === "system") localStorage.removeItem("lgx-theme"); else localStorage.setItem("lgx-theme", t); } catch (e) {}
    const [icon, label] = THEME_UI[t];
    const next = THEME_UI[THEMES[(THEMES.indexOf(t) + 1) % THEMES.length]][1].toLowerCase();
    $("theme").innerHTML = ic(icon);
    $("theme").title = `${label}. Tocá para pasar a ${next}.`;
    $("theme").setAttribute("aria-label", `${label}. Cambiar a ${next}`);
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => (m.content = t === "system" ? m.dataset.def : t === "dark" ? "#161615" : "#f7f7f5"));
  }
  $("theme").onclick = () => applyTheme(THEMES[(THEMES.indexOf(savedTheme()) + 1) % THEMES.length]);
  applyTheme(savedTheme());
  function showConnect(extra) {
    $("status").textContent = "Sin conectar";
    showBanner(`${extra ? esc(extra) + "<br>" : ""}Para ver el tablero, conectá tu cuenta de Trello. Se abre trello.com, tocás <b>Allow</b> y volvés acá. El permiso dura 30 días y queda solo en este navegador. <button class="primary" id="connect2">Conectar Trello</button>`, extra ? "err" : "");
    $("connect2").onclick = () => (location.href = authUrl());
    $("main").innerHTML = "";
  }
  function authFailed() {
    token = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    clearInterval(timer);
    cards = []; members = []; me = null; lastLoaded = null;
    setAuthUi();
    showConnect("Tu conexión con Trello venció o se revocó.");
  }
  $("auth").onclick = () => {
    $("userMenu").open = false;
    if (!token) { location.href = authUrl(); return; }
    confirmBox(`<h3>Desconectar Trello</h3><p>Se revoca el permiso de esta página en tu cuenta de Trello y se borra de este navegador. Para volver a usarla, tocás «Conectar Trello».</p>`, async () => {
      try { await api("DELETE", `/tokens/${token}`); } catch (e) {}
      token = null;
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      clearInterval(timer);
      cards = []; members = []; me = null; lastLoaded = null;
      setAuthUi();
      showConnect();
    });
  };

  (function boot() {
    if (!TRELLO_KEY) {
      $("status").textContent = "Falta configurar";
      $("auth").disabled = true;
      showBanner(`<div class="setup">Falta la API key de Trello. Pegala en <code>index.html</code>, en la línea <code>const TRELLO_KEY = "";</code> (solo la <b>API key</b>, nunca el Secret).</div>`, "warn");
      $("main").innerHTML = "";
      return;
    }
    const m = location.hash.match(/[#&]token=([0-9a-zA-Z]+)/);
    if (m) {
      token = m[1];
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search + "#tabla");
    } else if (/[#&]error=/.test(location.hash)) {
      history.replaceState(null, "", location.pathname + location.search + "#tabla");
    } else {
      try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    }
    setAuthUi();
    if (!token) { showConnect(); return; }
    load();
    schedule();
  })();
})();
</script>
</body>
</html>
